name: "Release"

on: workflow_dispatch

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The one place the tag is spelled. The release below and the
          # `latest.json` tauri-action writes in build.yml both read it from
          # here, because when they each derived it themselves they disagreed
          # and every updater download URL 404'd.
          echo "tag=shorthand-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `${{ steps.get-version.outputs.tag }}`,
              name: `Shorthand v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            })
            return data.id

  publish-tauri:
    permissions:
      contents: write
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is out of the release matrix until Apple signing credentials
          # exist. It would now build -- build.yml leaves the Apple variables
          # genuinely unset when sign-binaries is off, so the bundler no longer
          # dies in `security import` -- but an unsigned .app is quarantined on
          # download and needs `xattr -dr com.apple.quarantine` before it will
          # open, which is not a release we want to hand to anyone. Add the two
          # macOS rows back once there is a Developer ID certificate to sign with.
          #
          # ubuntu-22.04 is out because libspa fails to compile against the
          # libpipewire headers 22.04 ships (7 errors). The fork's system-audio
          # capture needs a newer libpipewire; ubuntu-24.04 builds it fine and still
          # produces a .deb.
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: false
      sign-updates: true
      asset-prefix: "shorthand"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      release-tag: ${{ needs.create-release.outputs.tag }}
      # Releases always build from scratch — never restore the Rust cache, so a
      # stale cached native lib can never be linked into a shipped artifact.
      no-cache: true
    secrets: inherit
