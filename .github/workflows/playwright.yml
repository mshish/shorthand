name: ldrepro
on: workflow_dispatch
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch: aarch64
            bun: bun-linux-arm64
          - os: ubuntu-24.04
            arch: x86_64
            bun: bun-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: mshish/shorthand-core
          ref: 915c24b1ce9bca30a96798cf11146b4bb969772b
          path: core
      - uses: oven-sh/setup-bun@v2
      - name: Build engine
        run: |
          cd core && bun install --frozen-lockfile >/dev/null
          bun build bin/shorthand-notes.ts --compile --target=${{ matrix.bun }} --outfile "$GITHUB_WORKSPACE/eng"
      - name: Tests
        shell: bash
        run: |
          set +e
          run() { "$1" read-block >/dev/null 2>"$1.err"; echo "exit=$? $(head -c 300 "$1.err" | tr '\n' ' ')"; }
          echo "== original"; run ./eng
          curl -sSL -o ld.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage; chmod +x ld.AppImage
          ./ld.AppImage --appimage-extract >/dev/null; PE=squashfs-root/usr/bin/patchelf; ST=squashfs-root/usr/bin/strip
          echo "== linuxdeploy's patchelf set-rpath"; cp eng e1; $PE --set-rpath '$ORIGIN/../lib' e1; echo "patchelf=$?"; ls -l eng e1 | awk '{print $5}'; run ./e1
          echo "== system patchelf"; sudo apt-get install -y -qq patchelf >/dev/null 2>&1; patchelf --version; cp eng e2; patchelf --set-rpath '$ORIGIN/../lib' e2; run ./e2
          echo "== strip only"; cp eng e3; $ST e3; echo "strip=$?"; run ./e3
          python3 - <<'PY'
          import zlib,struct
          w=h=256
          raw=b''.join(b'\x00'+b'\x00\x00\xff'*w for _ in range(h))
          def ch(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff)
          open('icon.png','wb').write(b'\x89PNG\r\n\x1a\n'+ch(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+ch(b'IDAT',zlib.compress(raw))+ch(b'IEND',b''))
          PY
          for place in usr/bin usr/lib/Shorthand; do
            echo "== linuxdeploy, engine in $place"
            rm -rf AppDir; mkdir -p AppDir/usr/bin AppDir/$place
            cp eng AppDir/$place/shorthand-notes; cp /bin/true AppDir/usr/bin/app
            printf '[Desktop Entry]\nType=Application\nName=App\nExec=app\nIcon=app\nCategories=Utility;\n' > app.desktop
            cp icon.png app.png
            ./ld.AppImage --appimage-extract-and-run --appdir AppDir -e AppDir/usr/bin/app -d app.desktop -i app.png > ld.log 2>&1; echo "linuxdeploy=$?"
            grep -E "shorthand-notes|ERROR" ld.log | head
            ls -l AppDir/$place/shorthand-notes | awk '{print $5}'
            run AppDir/$place/shorthand-notes
          done
